<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>Slideshow</title>
  <g fill="none" stroke="#8875E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- A second slide peeks out above the foreground photo. -->
