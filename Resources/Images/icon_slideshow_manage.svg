<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>Manage slideshow items</title>
  <g fill="none" stroke="#8875E8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <!-- A photo card identifies the managed content. -->
    <rect x="2.5" y="3.5" width="8.3" height="17" rx="2.1"/>
    <circle cx="5.3" cy="7" r="0.85"/>
    <path d="m4 11.2 1.5-1.7 1.3 1 1.65-1.8 1.1 2.5"/>
    <!-- Three adjustable rows represent managing slideshow entries. -->
    <path d="M13.2 6.4h7.9M13.2 12h7.9M13.2 17.6h7.9"/>
    <circle cx="16.1" cy="6.4" r="1.25" fill="#8875E8" fill-opacity="0.16"/>
    <circle cx="18.8" cy="12" r="1.25" fill="#8875E8" fill-opacity="0.16"/>
    <circle cx="15.3" cy="17.6" r="1.25" fill="#8875E8" fill-opacity="0.16"/>
  </g>
</svg>
