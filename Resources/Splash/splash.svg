<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#252936"/>
    <stop offset="0.48" stop-color="#11141e"/>
    <stop offset="1" stop-color="#070910"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#555b70"/>
    <stop offset=".42" stop-color="#1c2130"/>
    <stop offset=".72" stop-color="#111522"/>
    <stop offset="1" stop-color="#394b83"/>
  </linearGradient>
  <linearGradient id="ring" x1="0.2" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#d8c9ff"/>
    <stop offset=".22" stop-color="#a18aff"/>
    <stop offset=".57" stop-color="#547fff"/>
    <stop offset=".82" stop-color="#2465df"/>
    <stop offset="1" stop-color="#7ccfff"/>
  </linearGradient>
  <linearGradient id="check" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#e4e7ff"/>
    <stop offset="1" stop-color="#9d9eff"/>
  </linearGradient>
  <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6dfff"/>
    <stop offset=".55" stop-color="#b2a5ff"/>
    <stop offset="1" stop-color="#718dff"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
    <feOffset dx="0" dy="24" result="off"/>
    <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.02 0 0 0 0 0.06 0 0 0 .75 0"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    <feOffset dx="3" dy="8" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <!-- Scale the existing full Locksy tile down while keeping the original artwork and center. -->
  <g transform="translate(153.6 153.6) scale(0.7)">
<!-- Transparent outside the app tile -->
<g filter="url(#shadow)">
  <rect x="72" y="72" width="880" height="880" rx="220" fill="url(#body)" stroke="url(#edge)" stroke-width="9"/>
  <rect x="82" y="82" width="860" height="860" rx="210" fill="none" stroke="#6d748a" stroke-opacity=".13" stroke-width="3"/>
  <path d="M270 104 C180 120 120 185 104 275" fill="none" stroke="#aab5d4" stroke-opacity=".26" stroke-width="10" stroke-linecap="round"/>
  <path d="M748 925 C836 905 900 840 922 755" fill="none" stroke="#3b80ff" stroke-opacity=".28" stroke-width="12" stroke-linecap="round"/>
</g>
<!-- Recessed dark circular channel -->
<circle cx="512" cy="512" r="292" fill="none" stroke="#050710" stroke-opacity=".65" stroke-width="82"/>
<circle cx="512" cy="512" r="292" fill="none" stroke="#4a536b" stroke-opacity=".30" stroke-width="78"/>
<!-- Progress ring, rounded open ends -->
<path d="M 512 267 A 245 245 0 1 0 724 635" fill="none" stroke="#070a14" stroke-opacity=".55" stroke-width="83" stroke-linecap="round" transform="translate(0 5)"/>
<path d="M 512 267 A 245 245 0 1 0 724 635" fill="none" stroke="url(#ring)" stroke-width="78" stroke-linecap="round" filter="url(#softshadow)"/>
<path d="M 512 269 A 243 243 0 0 0 274 490" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
<!-- Raised check -->
<path d="M 423 523 L 485 585 Q 503 603 522 584 L 690 415" fill="none" stroke="#060914" stroke-opacity=".7" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 13)"/>
<path d="M 423 523 L 485 585 Q 503 603 522 584 L 690 415" fill="none" stroke="url(#check)" stroke-width="67" stroke-linecap="round" stroke-linejoin="round" filter="url(#softshadow)"/>
<path d="M 429 515 L 485 571 Q 503 589 522 570 L 681 411" fill="none" stroke="#ffffff" stroke-opacity=".48" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<!-- End dot -->
<circle cx="730" cy="634" r="39" fill="#050712" opacity=".72" transform="translate(2 8)"/>
<circle cx="730" cy="634" r="37" fill="url(#dot)" filter="url(#softshadow)"/>
<ellipse cx="718" cy="620" rx="11" ry="7" fill="#fff" opacity=".62" transform="rotate(-40 718 620)"/>

  </g>
</svg>